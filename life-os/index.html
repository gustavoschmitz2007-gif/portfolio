    <script>
      // Apply the last theme before first paint (avoids a flash).
      (function () {
        var t = 'dark', a = 'lime';
        try {
          var s = JSON.parse(localStorage.getItem('lifeos:theme') || 'null');
          if (s) { t = s.theme || t; a = s.accent || a; }
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.accent = a;
      })();
    </script>
    <style>html,body{background:#0a0b0d;margin:0}html[data-theme=light],html[data-theme=light] body{background:#f3f3ef}#splash{place-items:center;display:grid;position:fixed;top:0;bottom:0;left:0;right:0}#splash i{background:#c5f26b;border-radius:13px;width:44px;height:44px;animation:1.2s ease-in-out infinite p;display:block}@keyframes p{50%{opacity:.7;transform:scale(.86)}}</style>
